[package]
name = "markdd-editor"
version = "2.0.0"
description = "MarkDD Editor"
authors = ["MarkDD"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "markdd-editor"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
